<form (ngSubmit)="submit()" [formGroup]="form" class="flex flex-col flex-auto">
  <mat-form-field class="w-full">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
    <mat-error *ngIf="form.get('name').hasError('required')"
      >Field Required</mat-error
    >
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>Label</mat-label>
    <input matInput formControlName="label" />
    <mat-error *ngIf="form.get('label').hasError('required')"
      >Field Required</mat-error
    >
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>Description</mat-label>
    <input matInput formControlName="description" />
    <mat-error *ngIf="form.get('description').hasError('required')"
      >Field Required</mat-error
    >
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>Full Description</mat-label>

    <textarea matInput formControlName="full_description"></textarea>
    <mat-error *ngIf="form.get('full_description').hasError('required')"
      >Field Required</mat-error
    >
  </mat-form-field>

  <div class="mt-8">
    <div class="space-y-4">
      <ng-container
        *ngFor="
          let member of form.get('members')['controls'];
          let i = index;
          let first = first;
          let last = last;
          trackBy: trackByFn
        "
      >
        <div class="flex">
          <mat-form-field class="flex-1 min-w-0">
            <mat-label>Member</mat-label>
            <mat-select [formControl]="member.get('member')">
              <mat-option *ngFor="let member of members" [value]="member.code">
                {{ member.firstname + " " + member.lastname }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="member.get('member').hasError('required')"
              >Field Required</mat-error
            >
          </mat-form-field>
          <mat-form-field
            class="
              fuse-mat-no-subscript
              flex-auto
              w-full
              max-w-24
              sm:max-w-40
              ml-2
              sm:ml-4
            "
          >
            <mat-label>Role</mat-label>
            <mat-select [formControl]="member.get('role')">
              <mat-option *ngFor="let role of roles" [value]="role.value">
                {{ role.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <ng-container *ngIf="!(first && last)">
            <div
              class="flex items-center w-10 pl-2"
              [ngClass]="{ 'mt-6': first }"
            >
              <button
                class="w-8 h-8 min-h-8"
                mat-icon-button
                (click)="removeMemberField(i)"
                matTooltip="Remove"
              >
                <mat-icon
                  class="icon-size-5"
                  [svgIcon]="'heroicons_solid:trash'"
                ></mat-icon>
              </button>
            </div>
          </ng-container>
        </div>
      </ng-container>
    </div>
    <div
      class="
        group
        inline-flex
        items-center
        mt-2
        -ml-4
        py-2
        px-4
        rounded
        cursor-pointer
      "
      (click)="addMemberField()"
    >
      <mat-icon
        class="icon-size-5"
        [svgIcon]="'heroicons_solid:plus-circle'"
      ></mat-icon>
      <span class="ml-2 font-medium text-secondary group-hover:underline"
        >Add an member</span
      >
    </div>
  </div>

  <div
    class="
      flex flex-col
      sm:flex-row sm:items-center
      justify-between
      mt-4
      sm:mt-6
    "
  >
    <div class="-ml-2"></div>

    <div class="flex items-center mt-4 sm:mt-0">
      <button
        class="order-first sm:order-last"
        mat-flat-button
        [color]="'primary'"
        [disabled]="form.invalid"
      >
        {{ buttonLabel }}
      </button>
    </div>
  </div>
</form>
