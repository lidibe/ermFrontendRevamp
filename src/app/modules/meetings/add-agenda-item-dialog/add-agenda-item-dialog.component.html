<app-dialog-container (onCloseDialog)="closeDialog()" title="Add agenda item">
  <form *ngIf="data" [formGroup]="form" (submit)="onSubmit()">
    <div>
      <mat-form-field class="w-full">
        <mat-label>Title</mat-label>
        <input
          matInput
          [formControlName]="'title'"
          [placeholder]="'Title'"
          [spellcheck]="false"
        />
        <mat-error *ngIf="form.get('title').hasError('required')"
          >Field Required</mat-error
        >
      </mat-form-field>
    </div>

    <div class="flex flex-col mt-1">
      <mat-label class="font-semibold leading-5 text-base">Description</mat-label>
      <quill-editor
              class="mt-2 flex-auto"
              formControlName="full_description"
              [modules]="quillModules"></quill-editor>
    </div>

    <!--div class="flex justify-between">
      <div class="mt-8 w-full">
        <mat-form-field class="w-full">
          <mat-label>Status</mat-label>
          <input
            matInput
            [formControlName]="'status'"
            [placeholder]="'Status'"
            [spellcheck]="false"
          />
          <mat-error *ngIf="form.get('status').hasError('required')"
            >Field Required</mat-error
          >
        </mat-form-field>
      </div>
    </div-->

    <div
      class="
        flex
        justify-between
        mt-4
        sm:mt-6
      "
    >
    <button mat-flat-button type="button" (click)="closeDialog()">Cancel</button>
    <button
    mat-flat-button
    [color]="'primary'"
    [disabled]="form.invalid">Save</button>
    </div>
  </form>
</app-dialog-container>
