<div class="flex flex-col w-full">
  <ng-container *ngIf="!editMode && organization">
    <div class="
        relative
        w-full
        h-22
        sm:h-28
        px-8
        sm:px-12
        bg-white
        dark:bg-accent-700">
    </div>

    <div class="
        relative
        flex flex-col flex-auto
        items-center
        p-6 pt-0
        sm:p-12 sm:pt-0">
      <div class="w-full max-w-3xl">
        <div class="w-full max-w-3xl -mt-16">
          <div class="flex gap-2 items-center mb-1 justify-end">
            <button class="-ml-3 mr-auto text-primary py-2 px-4 text-base leading-5 font-medium" [routerLink]="['../']"
              mat-flat-button>
              <mat-icon class="icon-size-4" svgIcon="mat_solid:arrow_back_ios"></mat-icon> Back
            </button>

            <button *ngIf="organization?.is_deleted" type="button" (click)="unArchiveOrganization()"
              class="bg-teal-tranquility text-primary border border-solid flex-row-reverse py-2 px-5 text-base leading-5 font-medium"
              mat-button>
              <mat-icon class="icon-size-5 text-primary" [svgIcon]="'mat_solid:settings_backup_restore'"></mat-icon>
              <span class="mr-2">UnArchive</span>
            </button>

            <ng-container *ngIf="!organization.is_deleted">

              <button type="button" (click)="toggleEditMode()"
                class="bg-teal-tranquility text-primary border border-solid flex-row-reverse py-2 px-5 text-base leading-5 font-medium"
                mat-button>
                <mat-icon class="icon-size-5 text-primary" [svgIcon]="'heroicons_solid:pencil-square'"></mat-icon>
                <span class="mr-2">Edit</span>
              </button>

              <button type="button" mat-button color="warn" (click)="deleteOrganization()"
                class="bg-white border border-solid flex-row-reverse border-red-300 py-2 px-5 text-base leading-5 font-medium">
                <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:archive-box-x-mark'"></mat-icon>
                <span class="mr-2">Archive</span>
              </button>
            </ng-container>
          </div>
        </div>

        <div class="mt-3 text-4xl font-bold truncate pt-6">
          {{ organization?.name }}
        </div>

        <div class="flex flex-col mt-4 pt-6 border-t space-y-8">

          <ng-container *ngIf="organization.description">
            <div class="flex sm:items-center">
              <mat-icon class="text-primary" [svgIcon]="'heroicons_outline:document-text'"></mat-icon>
              <div class="mx-2 leading-6"><strong>Description:</strong></div>
              <div [innerHTML]="organization?.description"></div>
            </div>
          </ng-container>

          <ng-container *ngIf="organization.committees && organization?.committees?.length">
            <hr />
            <div class="flex sm:items-center">
              <h2 class="text-xl font-semibold text-primary">Committees</h2>
            </div>
            <ng-container *ngFor="
                let committee of organization?.committees;
                trackBy: trackByCode">
              <div class="flex justify-between sm:items-center">
                <div class="flex gap-x-2">
                <mat-icon class="text-primary" [svgIcon]="'heroicons_solid:briefcase'"></mat-icon>
                  <div class="leading-6">
                    {{ committee?.name }}
                  </div>
                </div>
                  <mat-icon class="text-primary cursor-pointer" [svgIcon]="'heroicons_solid:eye'" [routerLink]="['/bosedr/committees', committee?.code]"></mat-icon>
              </div>
            </ng-container>
          </ng-container>

        </div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="editMode">
    <div class="
        relative
        w-full
        h-20
        px-8
        sm:px-12
        bg-white
        dark:bg-accent-700">
      <div class="flex items-center justify-end w-full max-w-3xl mx-auto pt-6">
        <button mat-icon-button [matTooltip]="'Close'" [routerLink]="['../']">
          <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
      </div>
    </div>

    <h2 class="text-xl font-bold text-center leading-8 tracking-tight">{{ isNewOrganization ? 'Add Organization' : 'Edit Organization'}}</h2>
    <div class="relative flex flex-col flex-auto items-center px-6 sm:px-12">
      <div class="w-full max-w-3xl">
        <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
          <div class="mt-4">
            <mat-form-field class="w-full">
              <mat-label class="font-semibold leading-5 text-base">Name</mat-label>
              <input matInput formControlName="name" [placeholder]="'Name'" />
              <mat-error *ngIf="form.get('name').hasError('required')">
                Field Required
              </mat-error>
            </mat-form-field>
          </div>

          <div class="flex flex-col mt-2">
            <mat-label class="font-semibold leading-5 text-base">Description</mat-label>
            <quill-editor class="mt-2 flex-auto" formControlName="description" [modules]="quillModules"></quill-editor>
            <mat-error class="text-sm"
              *ngIf="form.get('description').hasError('required') && form.get('description').touched">
              Field Required
            </mat-error>
          </div>

          <br />

          <div class="
              flex
              items-center
              -mx-6
              sm:-mx-12
              py-4
              pr-8
              pl-6
              sm:pr-12 sm:pl-10
              border-t
              dark:bg-transparent mt-10">
            <button mat-button [color]="'warn'" [matTooltip]="'Archive'" *ngIf="!isNewOrganization"
              (click)="deleteOrganization()">
              Archive
            </button>
            <button class="ml-auto" mat-button [matTooltip]="'Cancel'" (click)="toggleEditMode()">
              Cancel
            </button>
            <button class="ml-2 py-2 px-4 text-base leading-5 font-medium text-white bg-primary" mat-flat-button
              [color]="'primary'" [disabled]="form.invalid" [matTooltip]="'Save'" (click)="saveOrganization()">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </ng-container>
</div>
