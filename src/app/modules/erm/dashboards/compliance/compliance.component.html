<div class="flex flex-col flex-auto w-full p-2 md:py-8 md:px-4">

    <div class="flex flex-wrap w-full max-w-screen-xl mx-auto">

        <div class="flex items-center justify-between w-full my-4 pl-4 sm:pr-4">
            <div class="mr-6">
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 md:leading-10 truncate">{{title}}</h2>
                <div class="font-medium tracking-tight text-secondary">{{title}} reporting and review insights</div>
            </div>
            <!-- Action buttons -->
            <div class="flex items-center">
                <!--button
                        class="hidden sm:inline-flex"
                        mat-stroked-button>
                    Settings
                </button>
                <button
                        class="hidden sm:inline-flex ml-3"
                        mat-flat-button
                        [color]="'primary'">
                    Export
                </button-->

                <!-- Actions menu (visible on xs) -->
                <!--div class="sm:hidden">
                    <button
                            [matMenuTriggerFor]="actionsMenu"
                            mat-icon-button>
                        <mat-icon [svgIcon]="'heroicons_outline:dots-vertical'"></mat-icon>
                    </button>
                    <mat-menu #actionsMenu="matMenu">
                        <button mat-menu-item>Export</button>
                        <button mat-menu-item>Settings</button>
                    </mat-menu>
                </div-->
            </div>
        </div>

        <div class="flex flex-auto w-1/3 min-w-180 h-150 p-4 bg-transparent">
            <div class="flex flex-col flex-auto p-6 pb-4 bg-card bg-transparent rounded overflow-hidden">
                <div class="flex items-start justify-between">
                    <div class="flex flex-col">
                        <div class="font-bold text-md text-secondary uppercase tracking-wider">Overall</div>
                        <div class="text-sm text-hint font-medium"></div>
                    </div>
                    <div class="ml-2">
                        <button
                                class="h-6 min-h-6 px-2 bg-hover"
                                mat-button
                                [matMenuTriggerFor]="chartTypeMenu">
                            <span class="font-medium text-sm text-secondary">{{chartName}}</span>
                        </button>
                        <mat-menu #chartTypeMenu="matMenu">
                            <button mat-menu-item (click)="setChart('bar-chart', 'Bar Chart')">Bar Chart</button>
                            <button mat-menu-item (click)="setChart('area-chart', 'Area Chart')">Area Chart</button>
                        </mat-menu>
                    </div>
                </div>
                <div class="flex items-center w-140 h-100 mt-auto">
                    <app-bar-chart-with-markers [id]="componentId" *ngIf="chartType === 'bar-chart'"></app-bar-chart-with-markers>
                    <app-overall-mixed-chart [id]="componentId" *ngIf="chartType === 'area-chart'"></app-overall-mixed-chart>
                </div>
            </div>
        </div>

        <div class="flex flex-auto w-1/3 min-w-180 h-150 p-4 bg-transparent" *ngFor="let kri of kris; let num = index">
            <div class="flex flex-col flex-auto p-6 pb-4 bg-card bg-transparent rounded overflow-hidden">
                <div class="flex items-start justify-between">
                    <div class="flex flex-col">
                        <div class="font-bold text-md text-secondary uppercase tracking-wider">{{kri.name}}</div>
                        <div class="text-sm text-hint font-medium">{{kri.name}}</div>
                    </div>
                    <div class="ml-2">
                        <button
                                class="h-6 min-h-6 px-2 bg-hover"
                                mat-button
                                [matMenuTriggerFor]="chartTypeMenu">
                            <span class="font-medium text-sm text-secondary">{{chartName}}</span>
                        </button>
                        <mat-menu #chartTypeMenu="matMenu">
                            <button mat-menu-item (click)="setChart('bar-chart', 'Bar Chart')">Bar Chart</button>
                            <button mat-menu-item (click)="setChart('area-chart', 'Area Chart')">Area Chart</button>
                        </mat-menu>
                    </div>
                    <div class="ml-2">
                        <button
                                class="h-6 min-h-6 px-2 bg-hover"
                                mat-button
                                [matMenuTriggerFor]="purchasesMenu">
                            <span class="font-medium text-sm text-secondary">Year {{currentYear}}</span>
                        </button>
                        <mat-menu #purchasesMenu="matMenu">
                            <button mat-menu-item (click)="setCurrentYear(getCurrentYear() - 2)">Year {{getCurrentYear() - 2}}</button>
                            <button mat-menu-item (click)="setCurrentYear(getCurrentYear() - 1)">Year {{getCurrentYear() - 1}}</button>
                            <button mat-menu-item (click)="setCurrentYear(getCurrentYear())">Year {{getCurrentYear()}}</button>
                        </mat-menu>
                    </div>
                </div>
                <div class="flex items-center w-140 h-100 mt-auto">
                    <app-mixed-chart [kriId]="kri.id" *ngIf="chartType === 'area-chart'"></app-mixed-chart>
                    <app-kri-data-bar-chart [tl]="kri.tl" [kriId]="kri.id" *ngIf="chartType === 'bar-chart'"></app-kri-data-bar-chart>
                </div>
            </div>
        </div>

    </div>

</div>
