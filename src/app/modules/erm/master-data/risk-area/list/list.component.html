<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden bg-card dark:bg-transparent">

    <!-- Header -->
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">
        <!-- Loader -->
        <div class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>

        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">Risk Types</div>

        <!-- Actions -->
        <div class="flex flex-shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <!-- Search -->
            <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript min-w-50">
                <mat-icon matPrefix [svgIcon]="'heroicons_outline:search'"></mat-icon>
                <input
                    matInput
                    [formControl]="searchInputControl"
                    [autocomplete]="'off'"
                    [placeholder]="'Search risk types'">
            </mat-form-field>

            <!-- Add button -->
            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="createThreshold()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">

        <!-- List -->
        <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden">

            <ng-container *ngIf="riskAreasCount > 0; else noRiskAreas">

                <!-- Table wrapper -->
                <div class="overflow-x-auto sm:overflow-y-auto" cdkScrollable>
                    <table
                        class="w-full min-w-320 table-fixed bg-transparent"
                        [ngClass]="{'pointer-events-none': isLoading}"
                        mat-table
                        matSort
                        [matSortActive]="'name'"
                        [matSortDisableClear]="true"
                        [matSortDirection]="'asc'"
                        [multiTemplateDataRows]="true"
                        [dataSource]="riskAreas$"
                        [trackBy]="trackByFn">

                        <!-- Name -->
                        <ng-container matColumnDef="name">
                            <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                                mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                                Name
                            </th>
                            <td class="pr-4 truncate" mat-cell *matCellDef="let item">
                                {{item.name}}
                            </td>
                        </ng-container>

                        <!-- Code -->
                        <ng-container matColumnDef="code">
                            <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                                mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                                Code
                            </th>
                            <td class="pr-4 truncate" mat-cell *matCellDef="let item">
                                {{item.code}}
                            </td>
                        </ng-container>

                        <!-- Description -->
                        <ng-container matColumnDef="description">
                            <th class="bg-gray-50 dark:bg-black dark:bg-opacity-5"
                                mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                                Description
                            </th>
                            <td class="pr-4 truncate" mat-cell *matCellDef="let item">
                                {{item.description}}
                            </td>
                        </ng-container>

                        <!-- Active -->
                        <ng-container matColumnDef="active">
                            <th class="w-24 bg-gray-50 dark:bg-black dark:bg-opacity-5"
                                mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                                Active
                            </th>
                            <td class="pr-4" mat-cell *matCellDef="let product">
                                <mat-icon class="text-green-400 icon-size-5"
                                          *ngIf="product.active"
                                          [svgIcon]="'heroicons_solid:check'"></mat-icon>
                                <mat-icon class="text-gray-400 icon-size-5"
                                          *ngIf="!product.active"
                                          [svgIcon]="'heroicons_solid:x'"></mat-icon>
                            </td>
                        </ng-container>

                        <!-- Details -->
                        <ng-container matColumnDef="details">
                            <th class="w-24 pr-8 bg-gray-50 dark:bg-black dark:bg-opacity-5"
                                mat-header-cell *matHeaderCellDef>
                                Details
                            </th>
                            <td class="pr-8" mat-cell *matCellDef="let item">
                                <button
                                    class="min-w-10 min-h-7 h-7 px-2 leading-6"
                                    mat-stroked-button
                                    (click)="toggleDetails(item.id)">
                                    <mat-icon class="icon-size-5"
                                              [svgIcon]="selectedRiskArea?.id === item.id ? 'heroicons_solid:chevron-up' : 'heroicons_solid:chevron-down'">
                                    </mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <!-- Expanded row -->
                        <ng-container matColumnDef="riskAreaDetails">
                            <td class="p-0 border-b-0"
                                mat-cell *matCellDef="let item"
                                [attr.colspan]="columns.length">
                                <div class="shadow-lg overflow-hidden"
                                     [@expandCollapse]="selectedRiskArea?.id === item.id ? 'expanded' : 'collapsed'">
                                    <div class="flex border-b">
                                        <form class="flex flex-col w-full" [formGroup]="selectedRiskAreaForm">
                                            <div class="flex flex-auto pl-12 pt-12 pr-12 pb-12">
                                                <mat-form-field class="pr-6 w-1/4">
                                                    <mat-label>Name</mat-label>
                                                    <input matInput formControlName="name">
                                                </mat-form-field>
                                                <mat-form-field class="pr-6 w-1/4">
                                                    <mat-label>Code</mat-label>
                                                    <input matInput formControlName="code">
                                                </mat-form-field>
                                                <mat-form-field class="w-1/4">
                                                    <mat-label>Description</mat-label>
                                                    <input matInput formControlName="description">
                                                </mat-form-field>
                                            </div>
                                            <div class="flex items-center justify-between w-full border-t px-8 py-4">
                                                <button mat-button color="warn">Delete</button>
                                                <button mat-flat-button color="primary">Update</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </td>
                        </ng-container>

                        <tr class="shadow" mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
                        <tr class="h-18 hover:bg-hover" mat-row *matRowDef="let row; columns: columns;"></tr>
                        <tr class="h-0" mat-row *matRowDef="let row; columns: ['riskAreaDetails']"></tr>
                    </table>
                </div>

                <mat-paginator
                    class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                    [ngClass]="{'pointer-events-none': isLoading}"
                    [length]="pagination.length"
                    [pageIndex]="pagination.page"
                    [pageSize]="pagination.size"
                    [pageSizeOptions]="[5, 10, 25, 100]"
                    [showFirstLastButtons]="true">
                </mat-paginator>

            </ng-container>

            <ng-template #noRiskAreas>
                <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">
                    There are no risk types!
                </div>
            </ng-template>

        </div>
    </div>
</div>
