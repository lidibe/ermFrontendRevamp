<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">
  <mat-drawer-container
    class="flex-auto h-full bg-card dark:bg-transparent"
    (backdropClick)="onBackdropClicked()"
  >
    <mat-drawer
      class="w-full md:w-160 dark:bg-gray-900"
      [mode]="drawerMode"
      [opened]="false"
      [position]="'end'"
      [disableClose]="true"
      #matDrawer
    >
      <router-outlet></router-outlet>
    </mat-drawer>

    <mat-drawer-content class="flex flex-col">
      <div class="flex-auto">
        <div class="flex flex-col sm:flex-row md:flex-col flex-auto justify-between py-8 px-6 md:px-8 border-b">
          <div>
            <div class="text-4xl font-extrabold tracking-tight leading-none">Kris</div>
            <div class="ml-0.5 font-medium text-secondary">
              <ng-container *ngIf="krisCount > 0">
                {{ krisCount }}
              </ng-container>
              {{ krisCount | i18nPlural: { '=0': 'No kri', '=1': 'kri', other: 'kris' } }}
            </div>
          </div>

          <div class="flex items-center mt-4 sm:mt-0 md:mt-4">
            <div class="flex-auto">
              <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript w-full min-w-50">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input
                  matInput
                  [formControl]="searchInputControl"
                  [autocomplete]="'off'"
                  [placeholder]="'Search kris'"
                />
              </mat-form-field>
            </div>

            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="createKri()">
              <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
              <span class="ml-2 mr-1">Add</span>
            </button>
          </div>
        </div>

        <div class="relative">
          <ng-container *ngIf="kris$ | async as kris">
            <ng-container *ngIf="kris.length; else noKris">
              <ng-container
                *ngFor="let kri of kris | sort: { property: 'key', descending: false }; let i = index; trackBy: trackByFn"
              >
                <div
                  class="z-20 flex items-center px-6 py-4 md:px-8 cursor-pointer hover:bg-hover border-b"
                  [ngClass]="{ 'bg-primary-50 dark:bg-hover': selectedKri && selectedKri.id === kri.id }"
                  (click)="goToKri(kri.id)"
                >
                  <div class="min-w-0 ml-4">
                    <div class="font-medium leading-5 truncate">{{ kri.key }} - {{ kri.name }}</div>
                    <div class="leading-5 truncate text-secondary">{{ kri.name }}</div>
                  </div>
                </div>
              </ng-container>
            </ng-container>
          </ng-container>

          <ng-template #noKris>
            <div class="p-8 sm:p-16 border-t text-4xl font-semibold tracking-tight text-center">
              There are no kris!
            </div>
          </ng-template>
        </div>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
