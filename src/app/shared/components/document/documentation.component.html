<div class="rounded -mt-1 flex-1">
    <p class="text-primary font-semibold">Join documents (Summary, Justification..)
    </p>
    <p class="text-cool-gray font-semibold text-md">Files supported: .pdf, .doc, .docx, .xlsx</p>
    <div class="dropzone bg-winter-sky py-8 px-4 text-center cursor-pointer mt-3 border-2 border-dashed border-primary"
        [ngClass]="{'bg-blue-100': isDragOver}" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)">
        <p class="text-cool-gray">Drag & Drop files here</p>
        <p class="text-cool-gray">or</p>
        <button type="button" mat-flat-button
            class="bg-teal-tranquility text-primary ml-auto mt-1 py-2 px-4 text-base leading-5 font-medium"
            (click)="fileInput.click()">Browse Files</button>
        <input type="file" #fileInput class="hidden" (change)="onUploadFile($event)" multiple>
    </div>
</div>
